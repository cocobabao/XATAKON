    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;
        const moonIcon = document.getElementById('icon-moon');
        const sunIcon = document.getElementById('icon-sun');
        const applyTheme = () => {
            const light = localStorage.getItem('theme') === 'light';
            body.classList.toggle('light-theme', light);
            body.setAttribute('data-theme', light ? 'light' : 'dark');
            if (moonIcon) moonIcon.style.display = light ? 'none' : 'block';
            if (sunIcon) sunIcon.style.display = light ? 'block' : 'none';
        };
        applyTheme();
        themeToggle?.addEventListener('click', () => {
            localStorage.setItem('theme', body.classList.contains('light-theme') ? 'dark' : 'light');
            applyTheme();
        });
        window.addEventListener('storage', event => { if (event.key === 'theme') applyTheme(); });

        const rankingLabels = { speed: 'зн./мин', accuracy: '%', xp: 'XP' };
        function renderRanking(container, entries, kind) {
            container.replaceChildren();
            if (!entries || !entries.length) {
                const empty = document.createElement('p'); empty.className = 'ranking-empty';
                empty.textContent = 'Пока нет результатов'; container.appendChild(empty); return;
            }
            entries.forEach((entry, index) => {
                const row = document.createElement('div');
                row.className = 'top-row' + (index < 3 ? ` rank-${index + 1}` : '');
                const rank = document.createElement('span'); rank.className = 'rank'; rank.textContent = String(index + 1);
                const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = (entry.nickname || '?').slice(0, 1).toUpperCase();
                const name = document.createElement('span'); name.className = 'name'; name.textContent = entry.nickname || 'Игрок';
                const value = document.createElement('span'); value.className = 'value';
                const number = Number(entry.value || 0);
                value.textContent = kind === 'accuracy' ? `${number.toFixed(1)}%` : Math.round(number).toLocaleString('ru-RU');
                row.append(rank, avatar, name, value); container.appendChild(row);
            });
        }
        async function refreshRankings() {
            try {
                const response = await fetch('http://127.0.0.1:8000/api/leaderboard', { cache: 'no-store' });
                if (!response.ok) throw new Error('API leaderboard error');
                const data = await response.json();
                if (!data.success) throw new Error('Leaderboard unavailable');
                document.querySelectorAll('[data-ranking]').forEach(container => {
                    const kind = container.dataset.ranking;
                    renderRanking(container, data[kind], kind);
                });
            } catch (error) {
                document.querySelectorAll('[data-ranking]').forEach(container => {
                    if (!container.children.length) {
                        const message = document.createElement('p'); message.className = 'ranking-empty';
                        message.textContent = 'Не удалось загрузить рейтинг. Проверьте, запущен ли сервер.';
                        container.appendChild(message);
                    }
                });
                console.warn('Не удалось обновить рейтинг:', error);
            }
        }
        refreshRankings();
        setInterval(refreshRankings, 10000);
        document.querySelectorAll('.top-card .filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const card = btn.closest('.top-card');
                card.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
            });
        });
    </script>
