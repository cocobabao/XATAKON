<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и регистрация | KeyFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="logreg.css">
</head>
<body class="auth-page">

    <div class="bg"></div>
    <div class="bg-overlay"></div>

    <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <div class="toast" id="toast" role="alert"></div>

    <div class="auth-container">
        <div class="form-card">
            <div class="card-header">
                <h2>Регистрация</h2>
            </div>

            <form id="registerForm" novalidate>
                <div class="input-group">
                    <label for="reg-name">Никнейм</label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" id="reg-name" placeholder="Ваш никнейм" required>
                    </div>
                    <span class="error-msg" id="reg-name-error"></span>
                </div>

                <div class="input-group">
                    <label for="reg-email">Email</label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        <input 
                        type="email" 
                        id="reg-email" 
                        placeholder="name@example.com" 
                        pattern="^[a-zA-Z0-9._%+-]{3,}@[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$"
                        title="Минимум 3 символа до @ и точка после (например: name@mail.ru)"
                        required
                    >
                    </div>
                    <span class="error-msg" id="reg-email-error"></span>
                </div>

                <div class="input-group">
                    <label for="reg-pass">Пароль</label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="reg-pass" placeholder="Придумайте пароль" required>
                    </div>
                    <span class="error-msg" id="reg-pass-error"></span>
                </div>

                <button type="submit" class="btn btn-outline" id="registerBtn">
                    <span>Зарегистрироваться</span>
                    <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>
        </div>

        <div class="divider"><span class="divider-text">или</span></div>

                <!-- ВХОД -->
        <div class="form-card">
            <div class="card-header">
                <h2>Вход в систему</h2>
            </div>

            <form id="loginForm" novalidate>
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        <input 
                            type="email" 
                            id="login-email" 
                            placeholder="name@example.com" 
                            required
                        >
                    </div>
                    <span class="error-msg" id="login-email-error"></span>
                </div>

                <div class="input-group">
                    <label for="login-pass">Пароль</label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="login-pass" placeholder="Введите пароль" required>
                    </div>
                    <span class="error-msg" id="login-pass-error"></span>
                </div>

                <button type="submit" class="btn btn-solid" id="loginBtn">
                    <span>Войти</span>
                    <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>
        </div>
    </div>

    <script src="logreg.js"></script>
</body>
</html>
